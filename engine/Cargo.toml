[package]
name = "nice-code-engine"
version = "0.3.3"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Fast multi-language analysis engine for Nice Code"

[dependencies]
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.1"
tree-sitter = "0.27.2"
tree-sitter-dart = "0.3.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
rayon = "1.12.0"
regex = "1.13.2"
