[package]
name = "nice-code-engine"
version = "0.1.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Fast multi-language analysis engine for Nice Code"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"
tree-sitter = "0.25.10"
tree-sitter-dart = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
rayon = "1.11.0"
