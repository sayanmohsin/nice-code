name: Validate Nice Code

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine:
    name: Rust engine and Bun support
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust tests
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Run Bun support tests
        run: bun scripts/test-engine.ts
      - name: Validate documentation
        run: bun scripts/check-docs.mjs
