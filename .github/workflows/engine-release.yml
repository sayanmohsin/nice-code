name: Build Nice Code engine

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == aarch64-unknown-linux* ]]; then
            cross build --release --manifest-path engine/Cargo.toml --target "${{ matrix.target }}"
          else
            cargo build --release --manifest-path engine/Cargo.toml --target "${{ matrix.target }}"
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          suffix=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then suffix=".exe"; fi
          cp "engine/target/${{ matrix.target }}/release/nice-code-engine${suffix}" "release/nice-code-engine-${{ matrix.target }}${suffix}"
          asset="nice-code-engine-${{ matrix.target }}${suffix}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            hash=$(powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 -LiteralPath 'release/$asset').Hash.ToLower()")
            printf '%s  %s\n' "$hash" "$asset" > "release/checksum-${{ matrix.target }}.txt"
          else
            (cd release && shasum -a 256 "$asset" > "checksum-${{ matrix.target }}.txt")
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir release
          find artifacts -type f ! -name 'checksum-*' -exec cp {} release/ \;
          find artifacts -type f -name 'checksum-*' -exec cat {} \; > release/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
