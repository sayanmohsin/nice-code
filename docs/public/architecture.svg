<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Nice Code architecture</title>
<desc id="desc">Sources and patterns, the target project, and the Node launcher feed the Rust analysis engine. The engine produces findings and runs native project tools. Both contribute to a report and exit decision, which produces terminal, agent or JSON, and SARIF output.</desc>
