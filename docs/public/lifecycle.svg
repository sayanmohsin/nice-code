<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
<title id="title">Pattern lifecycle</title>
<desc id="desc">A proposed pattern can be adopted. An adopted pattern can be revised or rejected. A revised pattern can be deprecated.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#efa77f"/></marker></defs>
<rect width="760" height="220" rx="14" fill="#20272e"/>
<g fill="none" stroke="#efa77f" stroke-width="2" marker-end="url(#arrow)"><path d="M155 75 H215"/><path d="M355 75 H415"/><path d="M555 75 H615"/><path d="M285 102 V155 H415"/></g>
<g fill="#303b44" stroke="#52616a" stroke-width="1.5"><rect x="15" y="48" width="140" height="54" rx="8"/><rect x="215" y="48" width="140" height="54" rx="8"/><rect x="415" y="48" width="140" height="54" rx="8"/><rect x="615" y="48" width="130" height="54" rx="8"/><rect x="415" y="128" width="140" height="54" rx="8"/></g>
<g fill="#f1efea" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle"><text x="85" y="81">Proposed</text><text x="285" y="81">Adopted</text><text x="485" y="81">Revised</text><text x="680" y="81">Deprecated</text><text x="485" y="161">Rejected</text></g>
</svg>
